<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estação Meteorológica Autônoma - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>

<header>
    <div>
        <h1>Estação Climatológica Autônoma</h1>
        <p>Painel de Controle Cooperativo Interativo</p>
    </div>
    <div class="controls">
        <button class="btn-toggle" onclick="toggleWidget('#w-temp')">+ Temperatura</button>
        <button class="btn-toggle" onclick="toggleWidget('#w-pressao')">+ Pressão</button>
        <button class="btn-toggle" onclick="toggleWidget('#w-lum')">+ Luminosidade</button>
        <button class="btn-toggle" onclick="toggleWidget('#w-chuva')">+ Histograma Simples</button>
        <button class="btn-toggle" onclick="toggleWidget('#w-sobreposto')">+ Histograma Sobreposto</button>
    </div>
</header>

<main class="dashboard-grid" id="dashboard">

    <div class="widget" id="w-temp">
        <div class="widget-header">
            <span>Temperatura Atual</span>
            <span class="btn-close" onclick="removerWidget('#w-temp')">&times;</span>
        </div>
        <div class="data-display" id="val-temp">--<span class="data-unit">°C</span></div>
    </div>

    <div class="widget" id="w-pressao">
        <div class="widget-header">
            <span>Pressão Atmosférica</span>
            <span class="btn-close" onclick="removerWidget('#w-pressao')">&times;</span>
        </div>
        <div class="data-display" id="val-pressao">--<span class="data-unit"> hPa</span></div>
    </div>

    <div class="widget" id="w-lum">
        <div class="widget-header">
            <span>Luminosidade (Indicador Instantâneo)</span>
            <span class="btn-close" onclick="removerWidget('#w-lum')">&times;</span>
        </div>
        <div class="data-display" id="val-luminosidade">--<span class="data-unit"> Lux</span></div>
        <div class="mock-progress">
            <div class="progress-bar" id="bar-luminosidade" style="width: 0%;"></div>
        </div>
    </div>

    <div class="widget" id="w-chuva">
        <div class="widget-header">
            <span>Histórico de Chuva (Série Simples)</span>
            <span class="btn-close" onclick="removerWidget('#w-chuva')">&times;</span>
        </div>
        <canvas id="chart-chuva" width="300" height="150"></canvas>
    </div>

    <div class="widget" id="w-sobreposto">
        <div class="widget-header">
            <span>Correlação: Chuva x Temperatura (Sobreposto)</span>
            <span class="btn-close" onclick="removerWidget('#w-sobreposto')">&times;</span>
        </div>
        <canvas id="chart-sobreposto" width="300" height="150"></canvas>
    </div>

</main>

</body>
</html>
